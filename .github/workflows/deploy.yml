name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS via rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Sync backend directory, excluding vendor, node_modules, and environment files
          rsync -avz --delete \
            --exclude="vendor" \
            --exclude="node_modules" \
            --exclude=".env" \
            --exclude="storage/app/public/private_audio" \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./backend/ root@${{ secrets.VPS_HOST }}:/var/www/agromind/backend/
          
          # Sync docker-compose file
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./docker-compose.yml root@${{ secrets.VPS_HOST }}:/var/www/agromind/

      - name: Run remote migrations & cache commands inside Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Fix storage and cache permissions on VPS host
            chmod -R 777 /var/www/agromind/backend/storage /var/www/agromind/backend/bootstrap/cache
            
            # Execute composer and php artisan commands inside the Docker container
            docker exec agromind-laravel.test-1 chmod -R 777 storage bootstrap/cache
            docker exec agromind-laravel.test-1 composer install --no-dev --optimize-autoloader
            docker exec agromind-laravel.test-1 php artisan migrate --force
            docker exec agromind-laravel.test-1 php artisan config:clear
            docker exec agromind-laravel.test-1 php artisan route:clear
            docker exec agromind-laravel.test-1 php artisan view:clear
            docker exec agromind-laravel.test-1 php artisan cache:clear
